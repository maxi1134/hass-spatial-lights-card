<!doctype html><html><head><meta charset="utf-8"><title>Add / remove lights in the editor</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px system-ui}
.dlg{display:flex;gap:16px;padding:12px;transform:translateZ(0)}
.edcol{flex:3;max-height:55vh;overflow:auto;background:#222;padding:8px}
.pvcol{flex:1;min-width:0}</style></head><body>
<div class="dlg"><div class="edcol" id="edcol"></div><div class="pvcol"><hui-card-preview id="pv"></hui-card-preview></div></div>
<script>
class HuiCardPreview extends HTMLElement{}customElements.define('hui-card-preview',HuiCardPreview);
class HaIcon extends HTMLElement{}customElements.define('ha-icon',HaIcon);
class HaCard extends HTMLElement{}customElements.define('ha-card',HaCard);
class HaSwitch extends HTMLElement{constructor(){super();this._c=false}get checked(){return this._c}
 set checked(v){this._c=!!v}connectedCallback(){this.onclick=()=>{this._c=!this._c;
 this.dispatchEvent(new Event('change',{bubbles:true}))}}}
customElements.define('ha-switch',HaSwitch);

// Everything the hass knows about. The card's list is a SUBSET, so there is
// something left to add.
const ALL=['light.a','light.b','light.c','light.d','light.e'];
const states={};ALL.forEach(i=>states[i]={entity_id:i,state:'on',attributes:{friendly_name:i.split('.')[1].toUpperCase(),
 brightness:255,rgb_color:[255,150,0],color_mode:'rgb',supported_color_modes:['rgb']}});
const hass={states,entities:{},callService:()=>Promise.resolve(),callWS:()=>Promise.resolve([]),
 connection:{subscribeMessage:()=>Promise.resolve(()=>{})}};

const ORIGINAL={type:'custom:spatial-light-color-card',entities:['light.a','light.b'],
  positions:{'light.a':{x:30,y:40},'light.b':{x:70,y:60}},
  aspect_ratio:'2:1', background_image:{url:'floorplan.svg'},
  // Seeded so a removal has something to prune and a Cancel has something to
  // put back -- the whole point of ENTITY_KEYED_OVERRIDES.
  label_overrides:{'light.b':'Bee'},
  color_overrides:{'light.b':{state_on:'#00ff00'}},
  lumens_overrides:{'light.b':1600}};

let CONFIG=JSON.parse(JSON.stringify(ORIGINAL));
let card, editor;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

// Home Assistant DEEP-FREEZES the Lovelace config before handing it to
// setConfig. A plain JSON clone does not, which is exactly how v1.51.0 shipped
// a splice on a frozen array: every probe passed, and a real dashboard threw
// "Cannot assign to read only property" on the first Remove.
function deepFreeze(o){
  if(o && typeof o==='object' && !Object.isFrozen(o)){
    Object.freeze(o); Object.values(o).forEach(deepFreeze);
  }
  return o;
}
function mountCard(){
  const pv=document.getElementById('pv'); pv.innerHTML='';
  card=document.createElement('spatial-light-color-card');
  // Kept so a probe can assert the card really was handed a frozen object.
  window.LAST_SET=deepFreeze(JSON.parse(JSON.stringify(CONFIG)));
  card.setConfig(window.LAST_SET); card.hass=hass;
  pv.appendChild(card); window.card=card;
}
function mountEditor(){
  const col=document.getElementById('edcol'); col.innerHTML='';
  editor=document.createElement('spatial-light-color-card-editor');
  editor.hass=hass; editor.setConfig(deepFreeze(JSON.parse(JSON.stringify(CONFIG))));
  col.appendChild(editor); window.editor=editor;
  editor.addEventListener('config-changed',(e)=>{ CONFIG=e.detail.config; mountCard(); });
}
async function reset(cfg){
  CONFIG=JSON.parse(JSON.stringify(cfg||ORIGINAL));
  mountEditor(); mountCard(); await sleep(500);
}
window.boot=async function(){ await reset(); return true; };

/** Open the full-size editor straight into Lights mode. */
async function openLights(){
  editor.shadowRoot.getElementById('cfgLightPlaceOpen').click();
  await sleep(600);
}
const C=()=>window.card;
const insp=()=>C().shadowRoot.getElementById('wallInspector');
const addField=()=>C().shadowRoot.querySelector('#wiAddSlot input');

/** Type into the add field and commit, the way the fallback control works
 *  when HA has not upgraded ha-entity-picker (which it has not, here). */
async function addLight(id){
  const f=addField(); if(!f) return 'no add field';
  f.value=id; f.dispatchEvent(new Event('change',{bubbles:true}));
  await sleep(500); return null;
}
/** Tap a light on the stage: pointerdown + pointerup with no movement, which
 *  selects without committing a drag. */
async function tapLight(id){
  const c=C(), st=c.shadowRoot.getElementById('wallEditorStage');
  const r=st.getBoundingClientRect();
  const p=CONFIG.positions[id];
  const sp=c._toScreenPct(p.x,p.y);
  const ev={clientX:r.left+r.width*sp.x/100, clientY:r.top+r.height*sp.y/100,
    pointerId:7, button:0, pointerType:'mouse', preventDefault(){}, altKey:true};
  c._onLightStagePointerDown(ev); c._onLightStagePointerUp(ev);
  await frame();
}
function planPositions(){ return JSON.parse(JSON.stringify(CONFIG.positions||{})); }
function dist(a,b){ return Math.round(Math.hypot(a.x-b.x,a.y-b.y)*10)/10; }

// ---------------------------------------------------------------- probes ---

window.addOne=async function(){
  await reset(); await openLights();
  const before={entities:CONFIG.entities.slice(), n:CONFIG.entities.length};
  const err=await addLight('light.c');
  const pos=(CONFIG.positions||{})['light.c'];
  return {err, before, after:CONFIG.entities.slice(),
    added: CONFIG.entities.includes('light.c'),
    position: pos ? {x:pos.x,y:pos.y} : null,
    onPlan: !!pos && pos.x>0 && pos.x<100 && pos.y>0 && pos.y<100,
    // The card HA just rebuilt has to come up with the new light selected,
    // or adding one looks like nothing happened.
    selected: C()._lightStageSelected,
    inspectorNamesIt: (insp().textContent||'').includes('light.c'),
    hasRemoveBtn: !!C().shadowRoot.getElementById('wiRemove'),
    // and the list behind the modal must have caught up
    editorListHas: !!Array.from(editor.shadowRoot.querySelectorAll('.entity-item'))
      .find(el=>(el.textContent||'').includes('light.c')),
    countLabel: C().shadowRoot.getElementById('wallEditorCount').textContent};
};

window.addSeveral=async function(){
  await reset(); await openLights();
  await addLight('light.c'); await addLight('light.d'); await addLight('light.e');
  const p=planPositions();
  const added=['light.c','light.d','light.e'].filter(id=>CONFIG.entities.includes(id));
  const pairs=[];
  for(let i=0;i<added.length;i++) for(let j=i+1;j<added.length;j++){
    pairs.push({a:added[i],b:added[j],d:dist(p[added[i]],p[added[j]])});
  }
  const GAP=window.card.constructor.LIGHT_ADD_GAP;
  return {added, positions:added.map(id=>({id,x:p[id].x,y:p[id].y})), pairs, GAP,
    allDistinct: pairs.every(q=>q.d>0),
    // Stacked lights read as one light that will not move.
    allClear: pairs.every(q=>q.d>=GAP),
    entities:CONFIG.entities.slice()};
};

window.removeOne=async function(){
  await reset(); await openLights();
  await tapLight('light.b');
  const sel=C()._lightStageSelected;
  const btn=C().shadowRoot.getElementById('wiRemove');
  if(!btn) return {selected:sel, err:'no Remove button'};
  btn.click(); await sleep(500);
  return {selected:sel,
    entities:CONFIG.entities.slice(),
    gone: !CONFIG.entities.includes('light.b'),
    positionGone: !(CONFIG.positions||{})['light.b'],
    // the refactor's whole point: one answer to "what does removing take"
    labelGone: !((CONFIG.label_overrides||{})['light.b']),
    colorGone: !((CONFIG.color_overrides||{})['light.b']),
    lumensGone: !((CONFIG.lumens_overrides||{})['light.b']),
    otherKept: JSON.stringify(CONFIG.positions['light.a'])==='{"x":30,"y":40}',
    nowSelected: C()._lightStageSelected,
    countLabel: C().shadowRoot.getElementById('wallEditorCount').textContent,
    editorListHas: !!Array.from(editor.shadowRoot.querySelectorAll('.entity-item'))
      .find(el=>(el.textContent||'').includes('light.b'))};
};

window.cancelRestores=async function(){
  await reset(); await openLights();
  await addLight('light.c');
  await tapLight('light.b');
  const rm=C().shadowRoot.getElementById('wiRemove'); if(rm){rm.click(); await sleep(500);}
  const mid={entities:CONFIG.entities.slice()};
  C().shadowRoot.getElementById('wallEditorCancel').click(); await sleep(700);
  return {mid, after:CONFIG.entities.slice(),
    entitiesExact: JSON.stringify(CONFIG.entities)===JSON.stringify(ORIGINAL.entities),
    positionsExact: JSON.stringify(CONFIG.positions)===JSON.stringify(ORIGINAL.positions),
    labelBack: JSON.stringify(CONFIG.label_overrides||{})===JSON.stringify(ORIGINAL.label_overrides),
    colorBack: JSON.stringify(CONFIG.color_overrides||{})===JSON.stringify(ORIGINAL.color_overrides),
    lumensBack: JSON.stringify(CONFIG.lumens_overrides||{})===JSON.stringify(ORIGINAL.lumens_overrides),
    modalClosed: !C().shadowRoot.getElementById('wallEditorStage')};
};

/** A config with NO positions key at all: restoring must delete the key the
 *  drag created, not leave an empty object behind. */
window.cancelDeletesInvented=async function(){
  await reset({type:'custom:spatial-light-color-card',entities:['light.a'],
    aspect_ratio:'2:1', background_image:{url:'floorplan.svg'}});
  const hadPositions='positions' in CONFIG;
  await openLights();
  await addLight('light.c');
  const mid={entities:CONFIG.entities.slice(), positions:Object.keys(CONFIG.positions||{})};
  C().shadowRoot.getElementById('wallEditorCancel').click(); await sleep(700);
  return {hadPositions, mid,
    entities:CONFIG.entities.slice(),
    positionsKeyGone: !('positions' in CONFIG),
    positionsValue: CONFIG.positions};
};

window.undoAdd=async function(){
  await reset(); await openLights();
  await addLight('light.c');
  const mid=CONFIG.entities.slice();
  window.dispatchEvent(new KeyboardEvent('keydown',{key:'z',ctrlKey:true,bubbles:true}));
  await sleep(500);
  const afterUndo=CONFIG.entities.slice();
  // Read NOW, not after the redo puts it back.
  const posAfterUndo=(CONFIG.positions||{})['light.c'];
  window.dispatchEvent(new KeyboardEvent('keydown',{key:'y',ctrlKey:true,bubbles:true}));
  await sleep(500);
  return {mid, afterUndo, afterRedo:CONFIG.entities.slice(),
    undoRemoved: !afterUndo.includes('light.c'),
    // A list without the light but a position still carrying it is an orphan
    // entry in the user's YAML.
    undoCleanedPosition: !posAfterUndo,
    redoRestored: CONFIG.entities.includes('light.c'),
    redoPosition: JSON.stringify((CONFIG.positions||{})['light.c'])};
};

window.undoRemove=async function(){
  await reset(); await openLights();
  await tapLight('light.b');
  C().shadowRoot.getElementById('wiRemove').click(); await sleep(500);
  const mid=CONFIG.entities.slice();
  window.dispatchEvent(new KeyboardEvent('keydown',{key:'z',ctrlKey:true,bubbles:true}));
  await sleep(500);
  return {mid, afterUndo:CONFIG.entities.slice(),
    back: CONFIG.entities.includes('light.b'),
    positionBack: JSON.stringify((CONFIG.positions||{})['light.b'])==='{"x":70,"y":60}',
    // the overrides the prune took have to come back with it
    labelBack: (CONFIG.label_overrides||{})['light.b']==='Bee',
    colorBack: !!((CONFIG.color_overrides||{})['light.b'])};
};

/** Selecting a light happens on the pointerdown of a DRAG. If the inspector
 *  grows there, the stage shrinks and the plan moves under the finger. */
window.panelStable=async function(){
  await reset(); await openLights();
  await frame(); await frame();
  const i0=insp().getBoundingClientRect(), s0=C().shadowRoot.getElementById('wallEditorStage').getBoundingClientRect();
  await tapLight('light.a');
  await frame(); await frame();
  const i1=insp().getBoundingClientRect(), s1=C().shadowRoot.getElementById('wallEditorStage').getBoundingClientRect();
  const c=C();
  c._setLightStageSelection(null);
  await frame(); await frame();
  const i2=insp().getBoundingClientRect(), s2=C().shadowRoot.getElementById('wallEditorStage').getBoundingClientRect();
  const r=(v)=>Math.round(v*10)/10;
  return {inspector:[r(i0.height),r(i1.height),r(i2.height)],
    stageH:[r(s0.height),r(s1.height),r(s2.height)],
    stageTop:[r(s0.top),r(s1.top),r(s2.top)],
    inspectorStable: Math.abs(i1.height-i0.height)<1 && Math.abs(i2.height-i0.height)<1,
    stageStable: Math.abs(s1.height-s0.height)<1 && Math.abs(s2.height-s0.height)<1
                 && Math.abs(s1.top-s0.top)<1};
};

/** The coordinates update live during a drag, so the inspector re-syncs every
 *  frame. The picker must not be rebuilt by that. */
window.pickerSurvivesDrag=async function(){
  await reset(); await openLights();
  const f0=addField(); if(!f0) return {err:'no add field'};
  f0.value='half typed';
  const c=C(), st=c.shadowRoot.getElementById('wallEditorStage'), r=st.getBoundingClientRect();
  const ev=(fx,fy)=>({clientX:r.left+r.width*fx, clientY:r.top+r.height*fy, pointerId:3,
    button:0, pointerType:'mouse', preventDefault(){}, altKey:true});
  c._onLightStagePointerDown(ev(0.30,0.40));
  const coords=[];
  for(let i=0;i<12;i++){ c._onLightStagePointerMove(ev(0.30+i*0.02,0.40+i*0.01));
    const el=c.shadowRoot.getElementById('wiCoords'); coords.push(el?el.textContent:null); }
  const f1=addField();
  const same = f1===f0;
  const kept = f1 && f1.value==='half typed';
  c._onLightStagePointerUp(ev(0.52,0.51)); await sleep(500);
  return {sameElement:same, keptTyping:kept,
    coordsMoved: coords[0]!==coords[coords.length-1],
    firstCoord:coords[0], lastCoord:coords[coords.length-1],
    droppedTo: JSON.stringify(CONFIG.positions['light.a'])};
};

/** Zoomed in, a new light has to land where the eye is -- not at the plan's
 *  centre, which may be off screen entirely. */
window.addFromZoom=async function(){
  await reset(); await openLights();
  const c=C();
  c._setWallZoom(3.2); await frame(); await frame();
  // Push the view off the plan's own centre so the two answers differ.
  c._wePanX=(c._wePanX||0)-220; c._wePanY=(c._wePanY||0)-120;
  if(typeof c._clampWallPan==='function') c._clampWallPan();
  c._applyWallZoom(); await frame(); await frame();
  const vp=c.shadowRoot.getElementById('wallEditorViewport').getBoundingClientRect();
  await addLight('light.c');
  const c2=C(), st=c2.shadowRoot.getElementById('wallEditorStage').getBoundingClientRect();
  const p=CONFIG.positions['light.c'];
  const sp=c2._toScreenPct(p.x,p.y);
  const sx=st.left+st.width*sp.x/100, sy=st.top+st.height*sp.y/100;
  return {zoom:c._weZoom, pos:{x:p.x,y:p.y},
    screen:{x:Math.round(sx),y:Math.round(sy)},
    viewport:{l:Math.round(vp.left),r:Math.round(vp.right),t:Math.round(vp.top),b:Math.round(vp.bottom)},
    insideView: sx>=vp.left-2 && sx<=vp.right+2 && sy>=vp.top-2 && sy<=vp.bottom+2,
    notPlanCentre: Math.abs(p.x-50)>3 || Math.abs(p.y-50)>3};
};

/** The Entities list's own Remove was rewritten to call the shared prune. */
window.listStillRemoves=async function(){
  await reset();
  const btn=Array.from(editor.shadowRoot.querySelectorAll('.entity-item .entity-btn.remove'))
    .find(b=>parseInt(b.dataset.index,10)===1);
  if(!btn) return {err:'no remove button'};
  btn.click(); await sleep(400);
  return {entities:CONFIG.entities.slice(),
    gone: !CONFIG.entities.includes('light.b'),
    positionGone: !(CONFIG.positions||{})['light.b'],
    labelGone: !((CONFIG.label_overrides||{})['light.b']),
    colorGone: !((CONFIG.color_overrides||{})['light.b']),
    lumensGone: !((CONFIG.lumens_overrides||{})['light.b']),
    otherKept: !!(CONFIG.positions||{})['light.a']};
};

/** Adding something already on the plan selects it rather than doing nothing
 *  visible, and never duplicates the entry. */
window.addDuplicate=async function(){
  await reset(); await openLights();
  await addLight('light.a');
  return {entities:CONFIG.entities.slice(),
    noDuplicate: CONFIG.entities.filter(e=>e==='light.a').length===1,
    selected: C()._lightStageSelected,
    positionUntouched: JSON.stringify(CONFIG.positions['light.a'])==='{"x":30,"y":40}'};
};

/** Walls mode must be exactly what it was. */
window.wallsUntouched=async function(){
  await reset(); await openLights();
  const lightsH=insp().getBoundingClientRect().height;
  C().shadowRoot.getElementById('wallModeWalls').click(); await sleep(500);
  const h=insp();
  return {lightsInspectorH:Math.round(lightsH),
    wallsText:(h.textContent||'').trim().slice(0,60),
    noAddField: !C().shadowRoot.querySelector('#wiAddSlot'),
    mode: C()._wallEditorMode,
    selectionCleared: C()._lightStageSelected===null,
    title: C().shadowRoot.querySelector('.wall-editor-title').textContent};
};

/** The config really is frozen, so the probes above are testing what HA does
 *  rather than what a JSON clone permits. */
window.configIsFrozen=async function(){
  await reset(); await openLights();
  const c=C();
  let pushThrew=false;
  try { c._config.entities.push('light.z'); } catch(e){ pushThrew=true; }
  return {handedFrozen: Object.isFrozen(window.LAST_SET),
    handedArrayFrozen: Object.isFrozen(window.LAST_SET.entities),
    // the CARD's own copy must NOT be the one it was handed -- that is the fix
    cardOwnsItsArray: c._config.entities!==window.LAST_SET.entities,
    cardArrayWritable: pushThrew===false,
    positionsWritable: !Object.isFrozen(c._config.positions)};
};

const PROBES=['configIsFrozen','addOne','addSeveral','removeOne','cancelRestores','cancelDeletesInvented',
  'undoAdd','undoRemove','panelStable','pickerSurvivesDrag','addFromZoom',
  'listStillRemoves','addDuplicate','wallsUntouched'];
window.probes=()=>PROBES;
// Sliced, because the full set overruns a single browser call.
window.all=async function(only){
  const names = Array.isArray(only) ? only : (only ? [only] : PROBES);
  const out={};
  for(const n of names){ try{ out[n]=await window[n](); }catch(e){ out[n]={threw:String(e&&e.message||e)}; } }
  return out;
};
</script>
<script>document.write('<script src="../hass-spatial-lights-card.js?v='+Date.now()+'" onload="boot()"><\/script>');</script>
</body></html>
