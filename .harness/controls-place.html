<!doctype html><html><head><meta charset="utf-8"><title>Floating controls placement</title>
<style>body{margin:0;background:#111;color:#ddd;font:12px system-ui}#host{width:640px}</style>
</head><body><div id="host"></div>
<script>
class HaIcon extends HTMLElement{}customElements.define('ha-icon',HaIcon);
class HaCard extends HTMLElement{}customElements.define('ha-card',HaCard);
class HaSwitch extends HTMLElement{get checked(){return !!this._c}set checked(v){this._c=!!v}}
customElements.define('ha-switch',HaSwitch);

const NAMES=['kitchen','living','hall','bed_left','bed_right','office','porch','garage'];
const ids=NAMES.map(n=>'light.'+n);
const states={};
ids.forEach(i=>states[i]={entity_id:i,state:'on',attributes:{friendly_name:i.split('.')[1],
 brightness:255,rgb_color:[255,170,80],color_mode:'rgb',supported_color_modes:['rgb','color_temp'],
 min_color_temp_kelvin:2000,max_color_temp_kelvin:6500,color_temp_kelvin:3000}});
const hass={states,entities:{},callService:()=>Promise.resolve(),callWS:()=>Promise.resolve([]),
 connection:{subscribeMessage:()=>Promise.resolve(()=>{})}};
const tick=(ms)=>new Promise(r=>setTimeout(r,ms||90));

// Spread the lights so a selection can sit in any corner or edge.
const POS={
  'light.kitchen':{x:15,y:12}, 'light.living':{x:50,y:12}, 'light.hall':{x:85,y:12},
  'light.bed_left':{x:15,y:50}, 'light.bed_right':{x:85,y:50},
  'light.office':{x:15,y:88}, 'light.porch':{x:50,y:88}, 'light.garage':{x:85,y:88},
};
const CFG=(over)=>Object.assign({type:'custom:spatial-light-color-card',entities:ids,
  positions:JSON.parse(JSON.stringify(POS)),
  aspect_ratio:'16:10', background_image:{url:'floorplan.svg'},
  controls_below:false, always_show_controls:true},over||{});

let card;
window.mount=async function(over, widthPx){
  // A dropped position is stored per card key and outlives a remount, so a
  // handPlaced() run would otherwise poison every sweep after it.
  try{localStorage.clear();}catch(_){}
  const host=document.getElementById('host');
  host.style.width=(widthPx||640)+'px';
  host.innerHTML='';
  card=document.createElement('spatial-light-color-card');
  card.setConfig(CFG(over)); card.hass=hass; host.appendChild(card);
  await tick(700); window.card=card; return true;
};

const R=(el)=>el.getBoundingClientRect();
const canvasEl=()=>card.shadowRoot.getElementById('canvas');
const panelEl=()=>card.shadowRoot.querySelector('.controls-floating');

// Geometry of the selection as it actually sits on screen: the union of the
// selected light markers' boxes. Using the markers (not config percentages)
// keeps this honest under rotation, where plan and screen axes differ.
function selBox(){
  const sel=[...card.shadowRoot.querySelectorAll('.light.selected')];
  if(!sel.length) return null;
  const bs=sel.map(R);
  return {left:Math.min(...bs.map(b=>b.left)), right:Math.max(...bs.map(b=>b.right)),
          top:Math.min(...bs.map(b=>b.top)), bottom:Math.max(...bs.map(b=>b.bottom))};
}
function overlapArea(a,b){
  const w=Math.min(a.right,b.right)-Math.max(a.left,b.left);
  const h=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
  return (w>0&&h>0)?w*h:0;
}
// Gap from the panel to the selection, 0 when they touch or overlap.
function gap(a,b){
  const dx=Math.max(0, Math.max(a.left-b.right, b.left-a.right));
  const dy=Math.max(0, Math.max(a.top-b.bottom, b.top-a.bottom));
  return Math.round(Math.hypot(dx,dy));
}

window.select=async function(list){
  card._selectedLights=new Set(list);
  card.updateLights();
  // The panel now ANIMATES to its new place (left/top, --transition-fast).
  // getComputedStyle during a running transition returns the interpolated
  // value, so a short wait measures where the box WAS, not where it landed --
  // that is what made an earlier sweep report a frozen position. Wait out the
  // transition, then wait for two clean frames.
  await tick(650);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
};

window.probe=function(){
  const p=panelEl(), c=canvasEl();
  if(!p) return {noPanel:true};
  const pb=R(p), cb=R(c), sb=selBox();
  const visible=getComputedStyle(p).opacity!=='0';
  const out={
    visible,
    panel:[Math.round(pb.left-cb.left),Math.round(pb.top-cb.top),Math.round(pb.width),Math.round(pb.height)],
    canvas:[Math.round(cb.width),Math.round(cb.height)],
    panelTallerThanHalf: pb.height > cb.height/2,
    insideCanvas: pb.left>=cb.left-1 && pb.right<=cb.right+1 && pb.top>=cb.top-1 && pb.bottom<=cb.bottom+1,
    classes:[...p.classList].filter(c=>c!=='controls-floating').join(' '),
  };
  if(sb){
    out.selection=[Math.round(sb.left-cb.left),Math.round(sb.top-cb.top),
                   Math.round(sb.right-sb.left),Math.round(sb.bottom-sb.top)];
    out.overlapPx=Math.round(overlapArea(pb,sb));
    out.coversSelection=out.overlapPx>0;
    out.gapToSelection=gap(pb,sb);
    // distance between centres, as a fraction of the canvas diagonal: this is
    // the "is it CLOSE" measure the request is really about
    const pc={x:(pb.left+pb.right)/2,y:(pb.top+pb.bottom)/2};
    const sc={x:(sb.left+sb.right)/2,y:(sb.top+sb.bottom)/2};
    const diag=Math.hypot(cb.width,cb.height);
    out.centreDistFrac=Math.round(Math.hypot(pc.x-sc.x,pc.y-sc.y)/diag*100)/100;
  }
  return out;
};

// Every corner and edge, so "near" is tested everywhere rather than once.
window.sweep=async function(over, widthPx){
  await window.mount(over, widthPx);
  const cases={
    topLeft:['light.kitchen'], topCentre:['light.living'], topRight:['light.hall'],
    midLeft:['light.bed_left'], midRight:['light.bed_right'],
    bottomLeft:['light.office'], bottomCentre:['light.porch'], bottomRight:['light.garage'],
    spreadTop:['light.kitchen','light.hall'],
    spreadAll:['light.kitchen','light.garage'],
    none:[],
  };
  const out={};
  for (const [k,v] of Object.entries(cases)) {
    await window.select(v);
    out[k]=window.probe();
  }
  const withSel=Object.entries(out).filter(([k])=>k!=='none').map(([,v])=>v);
  out._summary={
    neverCovers: withSel.every(v=>!v.coversSelection),
    alwaysInside: Object.values(out).every(v=>v.insideCanvas),
    maxCentreDist: Math.max(...withSel.map(v=>v.centreDistFrac||0)),
  };
  return out;
};

// It must not move on an unrelated state tick, or it will twitch constantly.
window.stability=async function(){
  await window.mount();
  await window.select(['light.kitchen']);
  const a=window.probe().panel;
  for (let i=0;i<5;i++){ card.updateLights(); await tick(120); }
  const b=window.probe().panel;
  // a brightness change on an unrelated light
  hass.states['light.garage']={...hass.states['light.garage'],
    attributes:{...hass.states['light.garage'].attributes, brightness:120}};
  card.hass=hass; await tick(300);
  const c=window.probe().panel;
  return {first:a, afterFiveTicks:b, afterUnrelatedStateChange:c,
    stable: a.join()===b.join() && b.join()===c.join()};
};

// ---------------------------------------------------------------------------
// The grip must tell a DRAG from a TAP. Without a threshold, one pixel of
// twitch wrote a hand-placed position -- which permanently short-circuits
// tracking, in localStorage, across reloads. On touch a press almost always
// emits a pointermove, so brushing the grip pinned the panel for good.
// ---------------------------------------------------------------------------
const gripEl=()=>card.shadowRoot.getElementById('cfGrip');
function gpev(el,type,x,y,id){
  el.dispatchEvent(new PointerEvent(type,{pointerId:id||55,pointerType:'touch',button:0,
    buttons:type==='pointerup'?0:1,clientX:x,clientY:y,bubbles:true,cancelable:true,composed:true}));
}
const storedCount=()=>{try{return Object.keys(localStorage).filter(k=>k.indexOf('slc-ctrlpos')===0).length;}catch(_){return -1;}};

window.gripGesture=async function(dx,dy){
  await window.mount();
  await window.select(['light.kitchen']);
  const before=window.probe().panel;
  const g=gripEl(); const b=g.getBoundingClientRect();
  try{g.setPointerCapture=()=>{};g.releasePointerCapture=()=>{};}catch(_){}
  const x=b.left+b.width/2, y=b.top+b.height/2;
  gpev(g,'pointerdown',x,y);
  const steps=Math.max(1,Math.ceil(Math.max(Math.abs(dx),Math.abs(dy))/12));
  for(let i=1;i<=steps;i++) gpev(g,'pointermove',x+dx*i/steps,y+dy*i/steps);
  gpev(g,'pointerup',x+dx,y+dy);
  await tick(260);
  const after=window.probe().panel;
  await window.select(['light.garage']);
  const reselected=window.probe().panel;
  return {before, after, reselected, stored:storedCount(),
    moved: before.join()!==after.join(),
    stillTracks: after.join()!==reselected.join()};
};

// A twitch must change nothing; a real drag must pin and persist.
window.tapVsDrag=async function(){
  const twitch=await window.gripGesture(2,1);
  const drag=await window.gripGesture(72,48);
  return {twitch, drag,
    pass: !twitch.moved && twitch.stored===0 && twitch.stillTracks
       && drag.moved && drag.stored===1 && !drag.stillTracks};
};

// ---------------------------------------------------------------------------
// The placement memos must not outlive the selection they describe. _cfFreeY is
// HELD for the life of a selection and the panel's height is not a stable input
// (a lamp turning on grows the presets row), so a deselect that kept the memo
// left a reselection of the SAME light off-centre by half the height change.
// ---------------------------------------------------------------------------
window.memoAcrossDeselect=async function(){
  await window.mount({aspect_ratio:'2:1'}, 1400);
  await window.select(['light.bed_left']);
  const first={side:card._cfSide, freeY:card._cfFreeY, panel:window.probe().panel};
  await window.select([]);
  const idle={side:card._cfSide, key:card._cfKey, freeY:card._cfFreeY};
  // grow the panel while nothing is selected, the way a new preset row would
  const spacer=document.createElement('div'); spacer.style.height='48px';
  card.shadowRoot.querySelector('.controls-floating').appendChild(spacer);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  await window.select(['light.bed_left']);
  const again={side:card._cfSide, freeY:card._cfFreeY, panel:window.probe().panel};
  const sel=window.probe().selection;
  const selCy=sel[1]+sel[3]/2, panCy=again.panel[1]+again.panel[3]/2;
  return {first, idle, again, selCentreY:selCy, panelCentreY:panCy,
    offBy:Math.round(panCy-selCy),
    memosCleared: idle.side===null && idle.key===null && idle.freeY===null,
    // only meaningful for a sideways placement, where the free axis is held
    sideways: again.side==='right' || again.side==='left',
    recentred: Math.abs(panCy-selCy)<=2};
};

// ---------------------------------------------------------------------------
// A drag inside the editor's live preview must not pin the real card. Both are
// built from the same config, so they used to hash to one localStorage key.
// ---------------------------------------------------------------------------
window.previewLeak=async function(){
  try{localStorage.clear();}catch(_){}
  document.querySelectorAll('#hp,#hd').forEach(n=>n.remove());
  document.body.insertAdjacentHTML('beforeend',
    '<hui-card-preview id="hp" style="display:block;width:900px"></hui-card-preview><div id="hd" style="width:900px"></div>');
  const cfg=Object.assign(CFG(), {aspect_ratio:'2:1', controls_below:false, always_show_controls:true});
  const build=(host)=>{const c=document.createElement('spatial-light-color-card');
    c.setConfig(JSON.parse(JSON.stringify(cfg))); c.hass=hass; host.appendChild(c); return c;};
  const prev=build(document.getElementById('hp'));
  await tick(700);
  const g=prev.shadowRoot.getElementById('cfGrip'), b=g.getBoundingClientRect();
  try{g.setPointerCapture=()=>{};g.releasePointerCapture=()=>{};}catch(_){}
  const x=b.left+b.width/2, y=b.top+b.height/2;
  gpev(g,'pointerdown',x,y,61);
  for(let i=1;i<=5;i++) gpev(g,'pointermove',x+i*14,y+i*9,61);
  gpev(g,'pointerup',x+70,y+45,61);
  await tick(300);
  // a dashboard card created AFTER that drag -- the leak only bites on a fresh
  // read, since _loadFloatingPos memoizes per key
  const dash=build(document.getElementById('hd'));
  await tick(700);
  const P=(c)=>{const r=c.shadowRoot.querySelector('.controls-floating').getBoundingClientRect();
    const cb=c.shadowRoot.getElementById('canvas').getBoundingClientRect();
    return [Math.round(r.left-cb.left),Math.round(r.top-cb.top)];};
  dash._selectedLights=new Set(['light.kitchen']); dash.updateLights(); await tick(450);
  const a=P(dash);
  dash._selectedLights=new Set(['light.garage']); dash.updateLights(); await tick(450);
  const z=P(dash);
  const out={previewKey:prev._floatingPosKey(), dashKey:dash._floatingPosKey(),
    previewInside:prev._isInsideEditorPreview(), dashInside:dash._isInsideEditorPreview(),
    dashKitchen:a, dashGarage:z,
    keysDiffer:prev._floatingPosKey()!==dash._floatingPosKey(),
    dashStillTracks:a.join()!==z.join(),
    previewKeptItsDrop:prev.shadowRoot.querySelector('.controls-floating').classList.contains('dragged')};
  out.pass = out.keysDiffer && out.dashStillTracks && out.previewKeptItsDrop;
  document.querySelectorAll('#hp,#hd').forEach(n=>n.remove());
  return out;
};

// ---------------------------------------------------------------------------
// TABLET TRAVEL. The panel used to be forced to calc(100% - 24px) by a VIEWPORT
// media query, so on a tablet -- 768px viewport, 740px card -- it was 716px wide
// on a 740px canvas and had 4px of horizontal travel after the edge clamp.
// Selecting a group on one side of the plan and then the other moved it 4px.
// Run this with the pane emulating 768x1024.
// ---------------------------------------------------------------------------
window.travel=async function(hostWidth){
  await window.mount({}, hostWidth||740);
  const cv=canvasEl().getBoundingClientRect();
  const pn=panelEl().getBoundingClientRect();
  const xs=[];
  for (const s of [['light.kitchen'],['light.hall'],['light.office'],['light.garage']]){
    await window.select(s); xs.push(window.probe().panel[0]);
  }
  // and as GROUPS, which is what the report was about
  await window.select(['light.kitchen','light.bed_left']); const gl=window.probe();
  await window.select(['light.hall','light.bed_right']);   const gr=window.probe();
  return {canvas:[Math.round(cv.width),Math.round(cv.height)],
    panel:[Math.round(pn.width),Math.round(pn.height)],
    maxX:Math.round(cv.width-pn.width),
    xs, xRange:Math.max(...xs)-Math.min(...xs), distinctX:new Set(xs).size,
    groupLeft:gl.panel, groupRight:gr.panel, groupMoved:gl.panel.join()!==gr.panel.join(),
    // the panel must have room to actually go beside things
    hasRealTravel: (Math.max(...xs)-Math.min(...xs)) > 100};
};

// ---------------------------------------------------------------------------
// THE TOUCH RESET. The grip's pointerdown preventDefaults for every pointer
// type, which on a touch pointer suppresses the compatibility mouse events --
// so the 'dblclick' listener never fires, and Escape needs a keyboard a tablet
// does not have. Two taps counted in POINTER events are the way back.
// ---------------------------------------------------------------------------
window.touchReset=async function(){
  await window.mount();
  await window.select(['light.kitchen']);
  const g=gripEl(); const b=g.getBoundingClientRect();
  try{g.setPointerCapture=()=>{};g.releasePointerCapture=()=>{};}catch(_){}
  const x=b.left+b.width/2, y=b.top+b.height/2;
  // pin it with a genuine drag
  gpev(g,'pointerdown',x,y,77);
  for(let i=1;i<=6;i++) gpev(g,'pointermove',x+i*12,y+i*8,77);
  gpev(g,'pointerup',x+72,y+48,77);
  await tick(250);
  const pinned=window.probe().panel;
  await window.select(['light.garage']);
  const stayed=window.probe().panel;
  const storedBefore=storedCount();
  // two taps inside the 350ms window -- NO dblclick event is dispatched
  const g2=gripEl(); const b2=g2.getBoundingClientRect();
  try{g2.setPointerCapture=()=>{};g2.releasePointerCapture=()=>{};}catch(_){}
  const x2=b2.left+b2.width/2, y2=b2.top+b2.height/2;
  gpev(g2,'pointerdown',x2,y2,78); gpev(g2,'pointerup',x2,y2,78);
  await tick(90);
  gpev(g2,'pointerdown',x2,y2,78); gpev(g2,'pointerup',x2,y2,78);
  await tick(350);
  const storedAfter=storedCount();
  await window.select(['light.kitchen']); const a=window.probe().panel;
  await window.select(['light.garage']);  const z=window.probe().panel;
  return {pinned, stayed, storedBefore, storedAfter,
    pinHeld: pinned.join()===stayed.join(),
    cleared: storedBefore===1 && storedAfter===0,
    trackingResumed: a.join()!==z.join(),
    classes:[...panelEl().classList].filter(c=>c==='dragged'||c==='auto-placed')};
};

// Two SLOW taps must not reset -- that is just two separate taps.
window.slowTaps=async function(){
  await window.mount();
  await window.select(['light.kitchen']);
  const g=gripEl(); const b=g.getBoundingClientRect();
  try{g.setPointerCapture=()=>{};g.releasePointerCapture=()=>{};}catch(_){}
  const x=b.left+b.width/2, y=b.top+b.height/2;
  gpev(g,'pointerdown',x,y,79); for(let i=1;i<=6;i++) gpev(g,'pointermove',x+i*12,y+i*8,79); gpev(g,'pointerup',x+72,y+48,79);
  await tick(250);
  const before=storedCount();
  gpev(g,'pointerdown',x,y,80); gpev(g,'pointerup',x,y,80);
  await tick(600);
  gpev(g,'pointerdown',x,y,80); gpev(g,'pointerup',x,y,80);
  await tick(300);
  return {before, after:storedCount(), stillPinned:storedCount()===1};
};

// Moving a SELECTED light must move the panel, not leave it behind until some
// unrelated state change happens to run updateLights.
window.positionMove=async function(){
  await window.mount();
  await window.select(['light.kitchen']);
  const before=window.probe().panel;
  card._config.positions['light.kitchen']={x:85,y:88};
  card._smoothApplyPositions();
  await tick(320);
  const after=window.probe().panel;
  return {before, after, panelFollowed: before.join()!==after.join()};
};

// A hand-placed panel must win over any automatic placement.
window.handPlaced=async function(){
  await window.mount();
  await window.select(['light.kitchen']);
  const auto=window.probe().panel;
  // drop it somewhere deliberate
  card._saveFloatingPos({ fx: 0.05, fy: 0.60 });
  card._applyFloatingPos();
  await tick(200);
  const placed=window.probe().panel;
  await window.select(['light.garage']);   // selection moves to the far corner
  const afterReselect=window.probe().panel;
  return {auto, placed, afterReselect,
    handPlacedWins: placed.join()===afterReselect.join()};
};
</script>
<script>document.write('<script src="../hass-spatial-lights-card.js?v='+Date.now()+'"><\/script>');</script>
</body></html>
